name: test
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: testing
      uses: actions/checkout@v3
    - name: install NodeJs
      uses: actions/setup-node@v3
      with:
        node-version: 18
    - name: install dependecies
      run: npm ci
    - name: run tests
      run: npm test
